[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gpu-kernels"
version = "0.1.0"
description = "Ampere BF16 MoE and attention operator experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.7.1+cu128", "triton==3.3.1", "numpy==2.5.3", "psutil==7.2.2"]

[project.optional-dependencies]
baseline = ["ninja==1.13.2", "packaging==26.3"]

[tool.setuptools.packages.find]
where = ["src"]
